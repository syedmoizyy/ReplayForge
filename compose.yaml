services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: replayforge
      POSTGRES_USER: replayforge
      POSTGRES_PASSWORD: replayforge
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replayforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["replayforge-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["replayforge-redis:/data"]
volumes:
  replayforge-postgres:
  replayforge-redis:
