spring:
  application:
    name: replayforge
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/replayforge}
    username: ${DATABASE_USER:replayforge}
    password: ${DATABASE_PASSWORD:replayforge}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
replayforge:
  instance-id: ${REPLAYFORGE_INSTANCE_ID:local}
  replay-execution:
    core-threads: ${REPLAY_CORE_THREADS:1}
    max-threads: ${REPLAY_MAX_THREADS:4}
    queue-capacity: ${REPLAY_QUEUE_CAPACITY:32}
    max-source-events: ${REPLAY_MAX_SOURCE_EVENTS:10000}
    retry-after-seconds: ${REPLAY_RETRY_AFTER_SECONDS:5}
  workflow-broker:
    stream: ${WORKFLOW_STREAM:replayforge:workflow}
    dead-letter-stream: ${WORKFLOW_DLQ_STREAM:replayforge:workflow:dlq}
    max-attempts: ${WORKFLOW_MAX_ATTEMPTS:4}
    initial-backoff-ms: ${WORKFLOW_INITIAL_BACKOFF_MS:100}
    poll-delay-ms: ${WORKFLOW_POLL_DELAY_MS:250}
    consumers-enabled: ${WORKFLOW_CONSUMERS_ENABLED:true}
springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
