spring:
  application:
    name: replayforge
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/replayforge}
    username: ${DATABASE_USER:replayforge}
    password: ${DATABASE_PASSWORD:replayforge}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
replayforge:
  instance-id: ${REPLAYFORGE_INSTANCE_ID:local}
